<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bezel-grad" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="60%"  stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <radialGradient id="bezel-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="75%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%"  stop-color="#666666" stop-opacity="0.15"/>
      <stop offset="97%"  stop-color="#999999" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- outer shadow -->
  <circle cx="250" cy="252" r="242" fill="#000000" fill-opacity="0.6"/>
  <!-- bezel body -->
  <circle cx="250" cy="250" r="242" fill="#111111"/>
  <circle cx="250" cy="250" r="240" fill="url(#bezel-grad)"/>
  <!-- bezel concentric rings -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#444444" stroke-width="0.5"/>
  <circle cx="250" cy="250" r="234" fill="none" stroke="#333333" stroke-width="0.4"/>
  <circle cx="250" cy="250" r="228" fill="none" stroke="#2a2a2a" stroke-width="0.4"/>
  <!-- catchlight arc top-left -->
  <path d="M 105 115 A 205 205 0 0 1 325 65" fill="none" stroke="#777777" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <!-- bezel sheen -->
  <circle cx="250" cy="250" r="240" fill="url(#bezel-sheen)"/>
  <!-- inner bevel lip -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="#3a3a3a" stroke-width="0.8"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#111111" stroke-width="3"/>
  <!-- face -->
  <circle cx="250" cy="250" r="212" fill="#0d0d0d"/>
</svg>
