<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="face-bg" cx="50%" cy="42%" r="54%">
      <stop offset="0%"   stop-color="#1c1c1c"/>
      <stop offset="60%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="bezel-body" cx="46%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#686868"/>
      <stop offset="35%"  stop-color="#3e3e3e"/>
      <stop offset="70%"  stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#161616"/>
    </radialGradient>
    <radialGradient id="bezel-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="78%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%"  stop-color="#888888" stop-opacity="0.18"/>
      <stop offset="96%"  stop-color="#cccccc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="inner-bevel" cx="50%" cy="50%" r="50%">
      <stop offset="82%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="92%"  stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.70"/>
    </radialGradient>
    <clipPath id="face-clip">
      <circle cx="250" cy="250" r="218"/>
    </clipPath>
  </defs>

  <!-- Outer shadow -->
  <circle cx="252" cy="253" r="244" fill="#000000" fill-opacity="0.55"/>

  <!-- Bezel body -->
  <circle cx="250" cy="250" r="244" fill="#111111"/>
  <circle cx="250" cy="250" r="242" fill="url(#bezel-body)"/>
  <circle cx="250" cy="250" r="240" fill="none" stroke="#555" stroke-width="0.4"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#444" stroke-width="0.3"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="#333" stroke-width="0.3"/>
  <path d="M 105 112 A 206 206 0 0 1 328 62" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" opacity="0.28"/>
  <circle cx="250" cy="250" r="242" fill="url(#bezel-sheen)"/>

  <!-- Inner bevel ring -->
  <circle cx="250" cy="250" r="224" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#444444" stroke-width="0.8"/>
  <circle cx="250" cy="250" r="219" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Instrument face -->
  <circle cx="250" cy="250" r="218" fill="url(#face-bg)"/>
  <circle cx="250" cy="250" r="218" fill="url(#inner-bevel)"/>

  <!-- ── COLORED ARC ZONES ─────────────────────────────── -->
  <!-- White arc: 20–80 kt (stall speed / flap range) -->
  <path d="M 144.0 433.6 A 212 212 0 0 1 87.6 113.73"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"
        clip-path="url(#face-clip)"/>
  <!-- Green arc: 60–160 kt (normal operating) -->
  <path d="M 46.39 226.2 A 205 205 0 0 1 453.61 226.2"
        fill="none" stroke="#22bb55" stroke-width="7" stroke-linecap="round"
        clip-path="url(#face-clip)"/>
  <!-- Yellow arc: 160–200 kt (caution) -->
  <path d="M 460.57 225.39 A 212 212 0 0 1 356.0 433.6"
        fill="none" stroke="#EF9F27" stroke-width="7" stroke-linecap="round"
        clip-path="url(#face-clip)"/>
  <!-- Red line: 200 kt (Vne) -->
  <line x1="357.5" y1="436.2" x2="345.0" y2="414.54"
        stroke="#cc2222" stroke-width="5" stroke-linecap="round"/>

  <!-- ── MAJOR TICKS (every 20 kt) ────────────────────── -->
  <line x1="142.5" y1="436.2"  x2="155.0" y2="414.54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="57.87" y1="346.49" x2="80.21" y2="335.27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36.45" y1="225.04" x2="61.28" y2="227.94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
