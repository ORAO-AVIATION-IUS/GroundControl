  <line x1="311.66" y1="44.03" x2="304.49" y2="67.98" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="414.7"  y1="111.8"  x2="395.55" y2="127.87" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="463.55" y1="225.04" x2="438.72" y2="227.94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="442.13" y1="346.49" x2="419.79" y2="335.27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="357.5"  y1="436.2"  x2="345.0"  y2="414.54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── MINOR TICKS (10 kt — medium) ─────────────────── -->
  <line x1="93.61" y1="397.54"   x2="105.98" y2="385.88" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38.27" y1="287.33"   x2="55.01"  y2="284.38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52.58" y1="164.84"   x2="68.19"  y2="171.58" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="131.86" y1="70.37"   x2="141.2"  y2="84.57"  stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="250.0"  y1="35.0"    x2="250.0"  y2="52.0"   stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="368.14" y1="70.37"   x2="358.8"  y2="84.57"  stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="447.42" y1="164.84"  x2="431.81" y2="171.58" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="461.73" y1="287.33"  x2="444.99" y2="284.38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="406.39" y1="397.54"  x2="394.02" y2="385.88" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── 5-KT MINOR TICKS (short) ─────────────────────── -->
  <line x1="116.65" y1="418.65" x2="123.47" y2="410.02" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="73.88"  y1="373.32" x2="82.89"  y2="367.01" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="45.91"  y1="317.63" x2="56.35"  y2="314.17" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="35.09"  y1="256.25" x2="46.09"  y2="255.93" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
