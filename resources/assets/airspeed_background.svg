  <line x1="107.07" y1="89.39"  x2="114.38" y2="97.61"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="159.14" y1="55.14"  x2="163.79" y2="65.11"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="218.84" y1="37.27"  x2="220.43" y2="48.15"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="281.16" y1="37.27"  x2="279.57" y2="48.15"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="340.86" y1="55.14"  x2="336.21" y2="65.11"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="392.93" y1="89.39"  x2="385.62" y2="97.61"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="432.99" y1="137.13" x2="423.63" y2="142.9"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="457.67" y1="194.35" x2="447.05" y2="197.2"  stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="464.91" y1="256.25" x2="453.91" y2="255.93" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="454.09" y1="317.63" x2="443.65" y2="314.17" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="426.12" y1="373.32" x2="417.11" y2="367.01" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="383.35" y1="418.65" x2="376.53" y2="410.02" stroke="#aaaaaa" stroke-width="1" stroke-linecap="round"/>

  <!-- ── SPEED LABELS ───────────────────────────────────── -->
  <text x="164.0"  y="398.96" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">20</text>
  <text x="96.3"   y="327.19" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">40</text>
  <text x="79.16"  y="230.03" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">60</text>
  <text x="118.24" y="139.44" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">80</text>
  <text x="200.67" y="85.23"  text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">100</text>
  <text x="299.33" y="85.23"  text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">120</text>
  <text x="381.76" y="139.44" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">140</text>
  <text x="420.84" y="230.03" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">160</text>
  <text x="403.7"  y="327.19" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">180</text>
  <text x="336.0"  y="398.96" text-anchor="middle" dominant-baseline="central" font-family="Arial Narrow,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">200</text>

  <!-- ── UNIT LABEL ─────────────────────────────────────── -->
  <text x="250" y="300" text-anchor="middle" dominant-baseline="central"
        font-family="Arial Narrow,Arial,sans-serif" font-size="16" font-weight="700"
        letter-spacing="2" fill="#888888">KNOTS</text>

  <!-- ── CENTER PIVOT HOLE ──────────────────────────────── -->
  <circle cx="250" cy="250" r="8" fill="#0a0a0a" stroke="#333333" stroke-width="1"/>
</svg>
