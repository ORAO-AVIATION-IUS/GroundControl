<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Pointer centered at (250,250) — rotate around (250,250) in QML -->
  <!-- Rotation: (speed - 20) / 180 * 300 - 150  degrees             -->

  <defs>
    <linearGradient id="needle-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#cccccc"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </linearGradient>
    <radialGradient id="hub-grad" cx="45%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#666666"/>
      <stop offset="60%"  stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
  </defs>

  <!-- Needle body — thin tapered blade pointing up (toward 12 o'clock) -->
  <!-- Tip at y=52 (198px from center), tail at y=290 (40px below center) -->
  <polygon
    points="250,52  246,250  254,250"
    fill="url(#needle-grad)"/>

  <!-- Counterweight tail (short stubby end below pivot) -->
  <polygon
    points="246,250  254,250  253,288  247,288"
    fill="#888888"/>

  <!-- Hub outer ring -->
  <circle cx="250" cy="250" r="14" fill="url(#hub-grad)" stroke="#555555" stroke-width="1"/>
  <!-- Hub inner cap -->
  <circle cx="250" cy="250" r="7"  fill="#1a1a1a" stroke="#444444" stroke-width="0.8"/>
  <!-- Hub center screw dot -->
  <circle cx="250" cy="250" r="3"  fill="#666666"/>
  <circle cx="248" cy="248" r="1"  fill="#888888" fill-opacity="0.5"/>
</svg>
