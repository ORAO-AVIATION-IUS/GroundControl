<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 800" width="200" height="800">
  <defs>
    <linearGradient id="horizonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" /> <stop offset="50%" style="stop-color:#8b4513;stop-opacity:1" /> <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="800" fill="url(#horizonGradient)"/>
  
  <line x1="0" y1="400" x2="200" y2="400" stroke="#ffffff" stroke-width="3"/>

  <g stroke="#ffffff" stroke-width="2" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    
    <line x1="70" y1="320" x2="130" y2="320"/>
    <text x="65" y="325" text-anchor="end">20</text>
    <text x="135" y="325" text-anchor="start">20</text>
    
    <line x1="80" y1="360" x2="120" y2="360"/>
    <text x="75" y="365" text-anchor="end">10</text>
    <text x="125" y="365" text-anchor="start">10</text>
    
    <line x1="80" y1="440" x2="120" y2="440"/>
    <text x="75" y="445" text-anchor="end">10</text>
    <text x="125" y="445" text-anchor="start">10</text>
    
    <line x1="70" y1="480" x2="130" y2="480"/>
    <text x="65" y="485" text-anchor="end">20</text>
    <text x="135" y="485" text-anchor="start">20</text>
  </g>
</svg>
