<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bezelOverlayGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" /> <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" /> </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#bezelOverlayGradient)" stroke-width="10"/>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#351c75" text-anchor="middle" stroke="#351c75" stroke-width="1.5">
    <g transform="rotate(30 100 100)">
      <line x1="100" y1="5" x2="100" y2="18"/>
      <text x="100" y="32" stroke="none">30</text>
    </g>
    <g transform="rotate(60 100 100)">
      <line x1="100" y1="5" x2="100" y2="15"/>
      <text x="100" y="30" stroke="none">60</text>
    </g>
    <g transform="rotate(90 100 100)">
      <line x1="100" y1="5" x2="100" y2="20" stroke-width="3"/>
      <text x="100" y="35" stroke="none">90</text>
    </g>
    
    <g transform="rotate(-30 100 100)">
      <line x1="100" y1="5" x2="100" y2="18"/>
      <text x="100" y="32" stroke="none">30</text>
    </g>
    <g transform="rotate(-60 100 100)">
      <line x1="100" y1="5" x2="100" y2="15"/>
      <text x="100" y="30" stroke="none">60</text>
    </g>
    <g transform="rotate(-90 100 100)">
      <line x1="100" y1="5" x2="100" y2="20" stroke-width="3"/>
      <text x="100" y="35" stroke="none">90</text>
    </g>
  </g>
</svg>
